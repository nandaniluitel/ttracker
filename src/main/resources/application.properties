spring.application.name=ttracker
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/ttracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:nandani}
spring.datasource.password=${DB_PASS:212002}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

logging.level.org.springframework.security=DEBUG
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

security.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_32+_CHARS
security.jwt.expiration-seconds=3600

