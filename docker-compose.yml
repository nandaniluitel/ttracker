services:
  mysql:
    image: mysql:8.0
    container_name: ttracker-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ttracker
      MYSQL_USER: nandani
      MYSQL_PASSWORD: "212002"
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - ttracker_mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass" ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  ttracker_mysql_data: { }
